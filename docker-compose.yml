services:
  db:
    image: postgres:17-alpine
    container_name: steelog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tesispassword123
      POSTGRES_DB: inventario_db
    ports:
      - "5435:5432"
    volumes:
      - steelog_postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

volumes:
  steelog_postgres_data:
